name: Publish ArcByte image

# Builds this fork's container image from `master` (the Dockerfile's runner-arcbyte target:
# runner-base plus the provider CLIs it drives, such as qodercli) and publishes it to the GitHub
# Container Registry of the repository that runs it (ghcr.io/<owner>/<repo>, lowercased). The
# upstream Docker Hub images are built from upstream's code, so a server that pulls them never
# shows this fork's UI or branding — docker-compose.selfhost.yml pulls this image instead.
#
# The build runs on GitHub's 16 GB hosted runners (free for public repos), so the server
# that runs the image never has to build it. The build settings match upstream's
# docker-publish.yml: webpack mode (Turbopack's native memory cannot be capped) with a
# 12 GB V8 heap, because the Dockerfile's 6 GB default runs out of heap under webpack.

on:
  push:
    branches:
      - master
  workflow_dispatch:

# A newer push to master supersedes a build that is still running.
concurrency:
  group: arcbyte-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read # check out the source
      packages: write # push the platform image to GHCR
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # The builder stage holds node_modules (~4 GB) plus the Next.js build output and the
      # standalone bundle; drop preinstalled toolchains the image build never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      # The webpack compile worker's RSS peaks above 12 GB on this codebase, close to the
      # runner's 16 GB. Swap turns a would-be OOM kill into a slower build.
      - name: Add swap
        run: |
          sudo fallocate -l 8G /swap-build
          sudo chmod 600 /swap-build
          sudo mkswap /swap-build
          sudo swapon /swap-build
          free -h

      # Plain docker CLI instead of the setup-buildx / login actions: the runner already
      # ships buildx, and every action left in this workflow is pinned to a commit.
      - name: Set up a BuildKit builder
        run: docker buildx create --name arcbyte --driver docker-container --use --bootstrap

      - name: Log in to GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # The source label links the package to this repository on GHCR (the Dockerfile's
      # own label names the upstream project).
      - name: Build and push platform image by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: runner-arcbyte
          platforms: ${{ matrix.platform }}
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
            OMNIROUTE_BUILD_MEMORY_MB=12288
          labels: |
            org.opencontainers.image.title=ArcByte | Open AI
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ env.IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Tag latest
    needs: build
    # Publish the architectures that did build: one failed leg must not keep the other off
    # the registry. The tag step still fails when no image was built at all.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # read the build job's digest artifacts
      packages: write # tag the multi-arch image on GHCR
    steps:
      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Tag latest and the commit
        run: |
          set -euo pipefail
          refs=()
          for digest_file in /tmp/digests/*; do
            [ -e "$digest_file" ] || continue
            refs+=("${IMAGE}@sha256:$(basename "$digest_file")")
          done
          if [ "${#refs[@]}" -eq 0 ]; then
            echo "::error::No platform image was built, so there is nothing to tag."
            exit 1
          fi
          if [ "${#refs[@]}" -lt 2 ]; then
            echo "::warning::Only ${#refs[@]} of 2 platforms built; tagging what exists."
          fi
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:sha-${GITHUB_SHA::7}" \
            "${refs[@]}"
          docker buildx imagetools inspect "${IMAGE}:latest"
