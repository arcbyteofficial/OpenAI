# ──────────────────────────────────────────────────────────────────────
# ArcByte | Open AI — Self-Host Compose
# ──────────────────────────────────────────────────────────────────────
# Runs this fork's image, which .github/workflows/arcbyte-image.yml builds from
# `master` and publishes to GHCR. The upstream diegosouzapw/omniroute images are
# built from upstream's code and never carry this fork's UI or branding.

services:
  redis:
    image: docker.io/library/redis:8.6.5-alpine
    container_name: omniroute-redis
    restart: unless-stopped

    volumes:
      - redis-data:/data

    command: redis-server --save 60 1 --loglevel warning

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  omniroute:
    image: ghcr.io/arcbyteofficial/openai:latest
    # Check the registry on every `up`, so a redeploy picks up the latest master build
    # instead of reusing the copy of :latest already on this machine.
    pull_policy: always
    container_name: omniroute
    restart: unless-stopped
    stop_grace_period: 40s

    env_file: .env

    environment:
      - DATA_DIR=/app/data
      - REDIS_URL=redis://redis:6379

    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:${DASHBOARD_PORT:-20128}:${DASHBOARD_PORT:-20128}"
      - "${APP_BIND_HOST:-127.0.0.1}:${API_PORT:-20129}:${API_PORT:-20129}"
      - "${APP_BIND_HOST:-127.0.0.1}:${LIVE_WS_PORT:-20132}:${LIVE_WS_PORT:-20132}"

    volumes:
      - omniroute-data:/app/data

    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  redis-data:
    name: omniroute-redis-data

  omniroute-data:
    name: omniroute-data
